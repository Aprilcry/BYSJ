{% extends 'base.html' %}

{% block title %}编辑帖子 - 智慧厨艺辅助系统{% endblock %}

{% block content %}
    <h1 class="text-center mb-4">编辑帖子</h1>
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="title" class="form-label">标题</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ post.title }}" required>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">内容</label>
            <textarea class="form-control" id="content" name="content" rows="10" required>{{ post.content }}</textarea>
        </div>

        <div class="mb-3">
            <label for="video" class="form-label">视频</label>
            <input type="file" class="form-control" id="video" name="video">
            {% if post.video_url %}
            <div class="mt-2">
                <video src="{{ post.video_url }}" controls style="max-width: 200px;"></video>
            </div>
            {% endif %}
        </div>
        <button type="submit" class="btn btn-primary">保存修改</button>
        <a href="{{ url_for('plaza.detail', id=post.id) }}" class="btn btn-secondary">取消</a>
    </form>
{% endblock %}

{% block scripts %}
    {{ super() }}
    <!-- Quill.js富文本编辑器 -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        // 确保DOM加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 隐藏原始textarea
            const contentTextarea = document.getElementById('content');
            contentTextarea.style.display = 'none';
            
            // 创建Quill编辑器容器
            const quillContainer = document.createElement('div');
            quillContainer.id = 'editor';
            quillContainer.style.height = '400px';
            contentTextarea.parentNode.insertBefore(quillContainer, contentTextarea);
            
            // 初始化Quill编辑器
            const quill = new Quill('#editor', {
                theme: 'snow',
                modules: {
                    toolbar: [
                        ['bold', 'italic', 'underline', 'strike'],
                        ['blockquote', 'code-block'],
                        [{ 'header': 1 }, { 'header': 2 }],
                        [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                        [{ 'script': 'sub' }, { 'script': 'super' }],
                        [{ 'indent': '-1' }, { 'indent': '+1' }],
                        [{ 'direction': 'rtl' }],
                        [{ 'size': ['small', false, 'large', 'huge'] }],
                        [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                        [{ 'color': [] }, { 'background': [] }],
                        [{ 'font': [] }],
                        [{ 'align': [] }],
                        ['clean'],
                        ['image']
                    ]
                }
            });
            
            // 设置初始内容
            quill.root.innerHTML = contentTextarea.value;
            
            // 监听编辑器内容变化，同步到textarea
            quill.on('text-change', function() {
                contentTextarea.value = quill.root.innerHTML;
            });
            
            // 处理图片上传
            const toolbar = quill.getModule('toolbar');
            toolbar.addHandler('image', function() {
                const input = document.createElement('input');
                input.setAttribute('type', 'file');
                input.setAttribute('accept', 'image/*');
                input.onchange = function() {
                    const file = this.files[0];
                    if (file) {
                        // 压缩图片
                        compressImage(file, 1920, 1080, 0.8).then(compressedBlob => {
                            const formData = new FormData();
                            formData.append('file', compressedBlob, file.name);
                            
                            // 上传图片
                            fetch('{{ url_for('plaza.upload_image') }}', {
                                method: 'POST',
                                body: formData,
                                credentials: 'same-origin'
                            })
                            .then(response => response.json())
                            .then(data => {
                                if (data.location) {
                                    // 插入图片到编辑器
                                    const range = quill.getSelection();
                                    quill.insertEmbed(range.index, 'image', data.location);
                                }
                            })
                            .catch(error => console.error('Error uploading image:', error));
                        });
                    }
                };
                input.click();
            });
        });
        
        // 文件压缩功能
        function compressImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                img.onload = function() {
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height) {
                        if (width > maxWidth) {
                            height = height * (maxWidth / width);
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width = width * (maxHeight / height);
                            height = maxHeight;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    canvas.toBlob(resolve, 'image/jpeg', quality);
                };
                
                img.src = URL.createObjectURL(file);
            });
        }
        
        // 表单提交前处理文件
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            if (form) {
                form.addEventListener('submit', async function(e) {
                    const imageInput = document.querySelector('input[name="image"]');
                    if (imageInput.files.length > 0) {
                        const compressedFiles = [];
                        for (let i = 0; i < imageInput.files.length; i++) {
                            const compressedBlob = await compressImage(imageInput.files[i], 1920, 1080, 0.8);
                            compressedFiles.push(new File([compressedBlob], imageInput.files[i].name, { type: 'image/jpeg' }));
                        }
                        
                        // 创建新的FormData
                        const formData = new FormData(this);
                        formData.delete('image');
                        compressedFiles.forEach((file, index) => {
                            formData.append('image', file);
                        });
                        
                        // 阻止默认提交
                        e.preventDefault();
                        
                        // 提交表单
                        fetch(this.action, {
                            method: 'POST',
                            body: formData,
                            credentials: 'same-origin'
                        })
                        .then(response => response.redirected ? window.location.href = response.url : response.text())
                        .then(data => console.log(data))
                        .catch(error => console.error('Error:', error));
                    }
                });
            }
        });
    </script>
{% endblock %}
