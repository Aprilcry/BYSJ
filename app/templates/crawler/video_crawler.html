{% extends 'base.html' %}

{% block title %}菜谱视频爬取{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">菜谱视频爬取</h1>
    
    <div class="row">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header bg-warning text-white">
                    <h5 class="card-title">选择菜谱</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="recipeSearch" class="form-label">搜索菜谱</label>
                        <input type="text" class="form-control" id="recipeSearch" placeholder="输入菜谱名称进行搜索">
                    </div>
                    <div id="recipeList" class="list-group" style="max-height: 500px; overflow-y: auto;">
                        <!-- 菜谱列表将通过JavaScript动态生成 -->
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header bg-warning text-white">
                    <h5 class="card-title">视频预览</h5>
                </div>
                <div class="card-body">
                    <div id="videoPlayer" class="mb-4" style="display: none;">
                        <!-- B站视频播放器 -->
                        <div class="embed-responsive embed-responsive-16by9">
                            <iframe id="bilibiliPlayer" class="embed-responsive-item" src="" frameborder="0" allowfullscreen></iframe>
                        </div>
                        <div class="mt-3">
                            <h6 id="videoTitle"></h6>
                            <p id="videoUrl"></p>
                        </div>
                    </div>
                    <div id="noVideo" class="text-center py-5">
                        <p>请先选择一个菜谱</p>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('crawler.index') }}" class="btn btn-secondary">返回</a>
                        <div>
                            <button class="btn btn-warning" id="nextVideo">下一个</button>
                            <button class="btn btn-success" id="useVideo" style="display: none;">使用此视频</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentRecipeId = null;
    let currentVideoPage = 1;
    let currentVideoIndex = 0;
    
    // 菜谱搜索
    let currentPage = 1;
    let currentKeyword = '';
    
    function loadRecipes(keyword = '', page = 1) {
        fetch(`{{ url_for('crawler.search_recipes') }}?keyword=${encodeURIComponent(keyword)}&page=${page}&per_page=20`)
        .then(response => response.json())
        .then(data => {
            const recipeList = document.getElementById('recipeList');
            
            // 如果是第一页，清空列表
            if (page === 1) {
                recipeList.innerHTML = '';
            }
            
            data.recipes.forEach(recipe => {
                const item = document.createElement('div');
                item.className = 'list-group-item list-group-item-action';
                item.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            ${recipe.current_image ? `<img src="${recipe.current_image}" alt="${recipe.title}" style="width: 50px; height: 50px; object-fit: cover; margin-right: 10px;">` : ''}
                            <span>${recipe.title}</span>
                        </div>
                        <button class="btn btn-sm btn-primary" data-recipe-id="${recipe.id}">爬取视频</button>
                    </div>
                `;
                recipeList.appendChild(item);
            });
            
            // 添加爬取视频按钮事件
            document.querySelectorAll('[data-recipe-id]').forEach(button => {
                button.addEventListener('click', function() {
                    currentRecipeId = this.getAttribute('data-recipe-id');
                    currentVideoPage = 1; // 重置页码
                    currentVideoIndex = 0; // 重置视频索引
                    fetchVideo(currentRecipeId, currentVideoPage, currentVideoIndex);
                });
            });
            
            // 保存当前状态
            currentPage = page;
            currentKeyword = keyword;
        });
    }
    
    // 菜谱搜索
    document.getElementById('recipeSearch').addEventListener('input', function() {
        const keyword = this.value.trim();
        loadRecipes(keyword, 1);
    });
    
    // 初始加载菜谱列表
    window.addEventListener('load', function() {
        loadRecipes();
    });
    
    // 添加滚动加载
    document.getElementById('recipeList').addEventListener('scroll', function() {
        if (this.scrollTop + this.clientHeight >= this.scrollHeight - 10) {
            // 滚动到底部，加载更多
            loadRecipes(currentKeyword, currentPage + 1);
        }
    });
    
    // 获取视频
    function fetchVideo(recipeId, page, videoIndex) {
        console.log(`[视频爬虫] 开始爬取菜谱ID: ${recipeId}，页码: ${page}，视频索引: ${videoIndex}`);
        
        fetch(`{{ url_for('crawler.search_videos') }}?recipe_id=${recipeId}&page=${page}&video_index=${videoIndex}`)
        .then(response => response.json())
        .then(data => {
            console.log(`[视频爬虫] 爬取结果:`, data);
            console.log(`[视频爬虫] 输出信息:`, data.output);
            
            if (data.recipe.video_url) {
                console.log(`[视频爬虫] 爬取到视频: ${data.recipe.video_url}`);
                
                const videoPlayer = document.getElementById('videoPlayer');
                const noVideo = document.getElementById('noVideo');
                const bilibiliPlayer = document.getElementById('bilibiliPlayer');
                const videoTitle = document.getElementById('videoTitle');
                const videoUrl = document.getElementById('videoUrl');
                const useVideoBtn = document.getElementById('useVideo');
                
                videoPlayer.style.display = 'block';
                noVideo.style.display = 'none';
                useVideoBtn.style.display = 'inline-block';
                
                // 提取BV号
                const bvMatch = data.recipe.video_url.match(/BV[0-9A-Za-z]+/);
                if (bvMatch) {
                    const bvid = bvMatch[0];
                    // 使用B站外链播放器
                    bilibiliPlayer.src = `//player.bilibili.com/player.html?bvid=${bvid}`;
                    console.log(`[视频爬虫] 提取到BV号: ${bvid}`);
                } else {
                    bilibiliPlayer.src = data.recipe.video_url;
                    console.log(`[视频爬虫] 直接使用视频URL`);
                }
                
                videoTitle.textContent = data.recipe.title;
                videoUrl.textContent = data.recipe.video_url;
                
                // 更新当前页码和视频索引
                currentVideoPage = data.page;
                currentVideoIndex = data.video_index;
                console.log(`[视频爬虫] 更新状态: 页码=${currentVideoPage}, 视频索引=${currentVideoIndex}`);
            } else {
                console.log(`[视频爬虫] 未找到视频`);
            }
        })
        .catch(error => {
            console.error(`[视频爬虫] 错误:`, error);
        });
    }
    
    // 下一个视频
    document.getElementById('nextVideo').addEventListener('click', function() {
        if (currentRecipeId) {
            // 增加视频索引，每页36个视频
            currentVideoIndex += 1;
            if (currentVideoIndex >= 36) {
                currentVideoIndex = 0;
                currentVideoPage += 1;
            }
            fetchVideo(currentRecipeId, currentVideoPage, currentVideoIndex);
        }
    });
    
    // 使用此视频
    document.getElementById('useVideo').addEventListener('click', function() {
        if (currentRecipeId) {
            const videoUrl = document.getElementById('videoUrl').textContent;
            
            fetch('{{ url_for('crawler.update_recipe_video') }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ recipe_id: currentRecipeId, video_url: videoUrl })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('视频更新成功');
                } else {
                    alert('更新失败: ' + data.error);
                }
            });
        }
    });
</script>
{% endblock %}
