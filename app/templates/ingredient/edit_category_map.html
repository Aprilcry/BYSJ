{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">编辑食材分类映射</h1>
    
    <form method="POST">
        <div class="form-group">
            <label for="id">ID</label>
            <input type="number" class="form-control" id="id" name="id" value="{{ mapping.id }}" readonly>
            <small class="form-text text-muted">ID为系统自动生成，不可修改</small>
        </div>
        
        <div class="form-group">
            <label for="ingredient_name">食材名称</label>
            <input type="text" class="form-control" id="ingredient_name" name="ingredient_name" value="{{ mapping.ingredient_name }}" required>
        </div>
        
        <div class="form-group">
            <label for="category">分类</label>
            <input type="text" class="form-control" id="category" name="category" value="{{ mapping.category }}" required>
        </div>
        
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="{{ url_for('ingredient.manage_category_map') }}" class="btn btn-secondary">取消</a>
    </form>
</div>
{% endblock %}
