{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">添加食材保质期映射</h1>
    
    <form method="POST">
        <div class="form-group">
            <label for="ingredient_name">食材名称</label>
            <input type="text" class="form-control" id="ingredient_name" name="ingredient_name" required>
        </div>
        
        <div class="form-group">
            <label for="shelf_life_days">保质期（天）</label>
            <input type="number" class="form-control" id="shelf_life_days" name="shelf_life_days" required>
        </div>
        
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="{{ url_for('ingredient.manage_shelf_life') }}" class="btn btn-secondary">取消</a>
    </form>
</div>
{% endblock %}
