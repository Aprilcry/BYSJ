{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">添加食材分类映射</h1>
    
    <form method="POST">
        <div class="form-group">
            <label for="ingredient_name">食材名称</label>
            <input type="text" class="form-control" id="ingredient_name" name="ingredient_name" value="{{ ingredient_name }}" required>
        </div>
        
        <div class="form-group">
            <label for="category">分类</label>
            <input type="text" class="form-control" id="category" name="category" required>
        </div>
        
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="{{ url_for('ingredient.manage_category_map') }}" class="btn btn-secondary">取消</a>
    </form>
</div>
{% endblock %}
