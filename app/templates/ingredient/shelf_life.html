{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">管理食材保质期映射</h1>
    
    <div class="mb-3">
        <a href="{{ url_for('ingredient.add_shelf_life') }}" class="btn btn-primary">添加保质期映射</a>
        <button id="batch-delete-btn" class="btn btn-danger">批量删除</button>
    </div>
    
    <table class="table table-bordered table-hover">
        <thead class="thead-dark">
            <tr>
                <th><input type="checkbox" id="select-all"></th>
                <th>ID</th>
                <th>食材名称</th>
                <th>保质期（天）</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for mapping in mappings %}
            <tr>
                <td><input type="checkbox" class="mapping-checkbox" value="{{ mapping.id }}"></td>
                <td>{{ mapping.id }}</td>
                <td>{{ mapping.ingredient_name }}</td>
                <td>{{ mapping.shelf_life_days }}</td>
                <td>
                    <a href="{{ url_for('ingredient.edit_shelf_life', id=mapping.id) }}" class="btn btn-sm btn-warning">编辑</a>
                    <a href="{{ url_for('ingredient.delete_shelf_life', id=mapping.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('确定要删除吗？');">删除</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
    // 全选/取消全选
    document.getElementById('select-all').addEventListener('change', function() {
        const checkboxes = document.querySelectorAll('.mapping-checkbox');
        checkboxes.forEach(checkbox => {
            checkbox.checked = this.checked;
        });
    });
    
    // 批量删除
    document.getElementById('batch-delete-btn').addEventListener('click', function() {
        const selectedIds = [];
        const checkboxes = document.querySelectorAll('.mapping-checkbox:checked');
        checkboxes.forEach(checkbox => {
            selectedIds.push(parseInt(checkbox.value));
        });
        
        if (selectedIds.length === 0) {
            alert('请选择要删除的记录');
            return;
        }
        
        if (confirm('确定要删除选中的记录吗？')) {
            fetch('{{ url_for('ingredient.batch_delete_shelf_life') }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify({ mapping_ids: selectedIds })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(data.message);
                    location.reload();
                } else {
                    alert(data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('删除失败');
            });
        }
    });
</script>
{% endblock %}
