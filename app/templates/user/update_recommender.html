{% extends 'base.html' %}

{% block title %}更新菜谱推荐 - 智慧厨艺辅助系统{% endblock %}

{% block content %}
    <div class="container update-recommender-container">
        <div class="update-recommender-modal">
            <div class="modal-header">
                <h2 class="modal-title">更新菜谱相关推荐</h2>
                <button id="close-modal" class="close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="update-status">
                    <div class="status-icon">
                        <i class="fas fa-sync-alt fa-spin"></i>
                    </div>
                    <div class="status-text">
                        <h3>正在更新推荐器数据...</h3>
                        <p>请耐心等待，此过程可能需要几分钟时间</p>
                    </div>
                </div>
                <div class="update-output">
                    <pre id="output-log"></pre>
                </div>
            </div>
            <div class="modal-footer">
                <button id="back-btn" class="btn btn-secondary" disabled>返回</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const outputLog = document.getElementById('output-log');
            const backBtn = document.getElementById('back-btn');
            const closeBtn = document.getElementById('close-modal');
            
            // 建立EventSource连接
            const eventSource = new EventSource('/user/update-recommender-stream');
            
            // 监听消息事件
            eventSource.onmessage = function(event) {
                const message = event.data.trim();
                
                // 检查是否为结束标志
                if (message === 'END') {
                    eventSource.close();
                    backBtn.disabled = false;
                    return;
                }
                
                // 将消息添加到输出日志
                outputLog.textContent += message + '\n';
                // 滚动到底部
                outputLog.scrollTop = outputLog.scrollHeight;
            };
            
            // 监听错误事件
            eventSource.onerror = function(error) {
                console.error('EventSource error:', error);
                eventSource.close();
                backBtn.disabled = false;
            };
            
            // 返回按钮点击事件
            backBtn.addEventListener('click', function() {
                window.location.href = '/user/';
            });
            
            // 关闭按钮点击事件
            closeBtn.addEventListener('click', function() {
                window.location.href = '/user/';
            });
        });
    </script>

    <style>
        /* 模态框容器 */
        .update-recommender-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 20px;
        }
        
        /* 模态框样式 */
        .update-recommender-modal {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 800px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* 模态框头部 */
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
            border-bottom: 1px solid rgba(251, 191, 36, 0.3);
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #92400E;
            margin: 0;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #92400E;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .close-btn:hover {
            background: rgba(146, 64, 14, 0.1);
        }
        
        /* 模态框主体 */
        .modal-body {
            padding: 32px;
            flex: 1;
            overflow-y: auto;
        }
        
        /* 更新状态 */
        .update-status {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding: 20px;
            background: #F8FAFC;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
        }
        
        .status-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        
        .status-text h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1E293B;
            margin: 0 0 4px 0;
        }
        
        .status-text p {
            font-size: 14px;
            color: #64748B;
            margin: 0;
        }
        
        /* 输出日志 */
        .update-output {
            background: #1E293B;
            border-radius: 12px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        #output-log {
            color: #E2E8F0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
            margin: 0;
            white-space: pre-wrap;
        }
        
        /* 模态框底部 */
        .modal-footer {
            padding: 24px 32px;
            background: #F8FAFC;
            border-top: 1px solid #E2E8F0;
            display: flex;
            justify-content: flex-end;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }
        
        .btn-secondary {
            background: #64748B;
            color: white;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: #475569;
            transform: translateY(-2px);
        }
        
        .btn-secondary:disabled {
            background: #94A3B8;
            cursor: not-allowed;
        }
        
        /* 滚动条样式 */
        .update-output::-webkit-scrollbar {
            width: 8px;
        }
        
        .update-output::-webkit-scrollbar-track {
            background: #2D3748;
            border-radius: 4px;
        }
        
        .update-output::-webkit-scrollbar-thumb {
            background: #64748B;
            border-radius: 4px;
        }
        
        .update-output::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .update-recommender-modal {
                margin: 20px;
                max-height: 90vh;
            }
            
            .modal-header,
            .modal-body,
            .modal-footer {
                padding: 20px;
            }
            
            .modal-title {
                font-size: 18px;
            }
            
            .status-text h3 {
                font-size: 16px;
            }
        }
    </style>
{% endblock %}
